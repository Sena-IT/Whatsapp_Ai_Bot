version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: utils/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=Aladdin_Leads_Db
      - DB_USER=postgres
      - DB_PASSWORD=Balji@1234
    volumes:
      - .:/app
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=Aladdin_Leads_Db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Balji@1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
